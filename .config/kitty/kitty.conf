# --- Шрифты ---
font_family      Liberation Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Размер шрифта
font_size 11.0


# --- Прозрачность ---
# background_opacity задает уровень прозрачности от 0.0 до 1.0.
# 1.0 - полностью непрозрачный
# 0.8 - легкая прозрачность (хорошее начало)
# 0.5 - полупрозрачный
background_opacity 0.8
dynamic_background_opacity yes


# --- Внешний вид курсора ---
cursor_shape     block
cursor_blink_interval 0


# --- Цветовая схема (простая и приятная Gruvbox Dark) ---
foreground #d5c4a1
background #282828
selection_foreground #282828
selection_background #d5c4a1

# Black
color0 #282828
color8 #928374

# Red
color1 #cc241d
color9 #fb4934

# Green
color2  #98971a
color10 #b8bb26

# Yellow
color3  #d79921
color11 #fabd2f

# Blue
color4  #458588
color12 #83a598

# Magenta
color5  #b16286
color13 #d3869b

# Cyan
color6  #689d6a
color14 #8ec07c

# White
color7  #a89984
color15 #d5c4a1



# Мапим все возможные коды иконок памяти на правильный шрифт
symbol_map U+ef85,U+e7c5,U+f08b5,U+f538 JetBrainsMono Nerd Font
symbol_map U+f017 JetBrainsMono Nerd Font
modify_font cell_width 100%

#Для копипасты
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt


#Для плавности курсора
cursor_trail 3
cursor_trail_start_threshold 0

# --- Фиксация размера окна ---
remember_window_size  no
initial_window_width  110c
initial_window_height 33c
